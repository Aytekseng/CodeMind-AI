version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: codemind-postgres
    environment:
      POSTGRES_USER: codemind
      POSTGRES_PASSWORD: codemindpassword
      POSTGRES_DB: codemind_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
