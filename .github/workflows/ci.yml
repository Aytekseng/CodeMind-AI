name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codemind
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: codemind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codemind -d codemind_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/CodeMind.Regression/CodeMind.Regression.csproj --configuration Release -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1903,NU1904
      - run: dotnet run --project tests/CodeMind.Regression --configuration Release --no-build
        env:
          TEST_DATABASE_CONNECTION: Host=localhost;Database=codemind_test;Username=codemind;Password=test-only-password
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodeMind.AIWorker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: CodeMind.AIWorker/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build -- --webpack
